# CorrFi CI. The same commands are run locally before each stage report.
name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "pytest==8.4.2" "numpy==2.3.*"
      - run: python analysis/s00/run_all.py
      - run: python -m pytest verifier/tests -q
      - name: contract size gate script
        run: python -m pytest contracts/script -q
      - name: backtest helpers (walk-forward splits, bootstrap, isotonic, σP table rule)
        run: python -m pytest backtest/tests -q
      - name: S02 data-processing tests (only once data/ is in the repository)
        run: if [ -d data/tests ]; then python -m pytest data/tests -q; else echo "data/ not committed yet"; fi
      - name: shared vectors are reproducible
        run: |
          python vectors/gen_fixedpoint.py
          python vectors/gen_market_scenarios.py
          git diff --exit-code -- vectors/

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: engine (fixed point, price points, reporter rules) — unit tests and type check
        working-directory: engine
        run: |
          npm ci
          npm test
          npm run typecheck
      - name: UI (quote controller) — unit tests, type check, production build
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run typecheck
          npx vite build --outDir "$RUNNER_TEMP/ui-dist"

  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge test
        working-directory: contracts
      - name: contract size gate (24,576 / 49,152 B; warn > 90%)
        run: python3 script/check_sizes.py
        working-directory: contracts
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: generated ABI matches the contracts
        working-directory: engine
        run: |
          npm ci
          node scripts/gen_abi.ts --check
      - name: pinned build (compiler, settings, sources, creation / runtime bytecode hashes) is reproduced here
        working-directory: engine
        run: node scripts/build_manifest.ts --check
      - name: integration on a local Anvil (deploy script, reporter, finalizer, CLIs, UI chain side)
        run: |
          (cd engine && npm run test:anvil)
          (cd ui && npm ci && npm run test:anvil)
